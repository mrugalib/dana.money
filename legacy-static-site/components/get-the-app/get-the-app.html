<!--
  Dana AI — Get The App (design.md site map item 14's real content — distinct from the generic
  Final CTA banner already built at components/final-cta/; both exist, neither replaces the other).

  Real content used verbatim: title "GET THE APP", body copy, both store URLs.

  Visual: assets/Get-The_App-Screen.webp — confirmed present (listed assets/ first), self-framed
  exactly like hero.gif (transparent corners around an opaque phone shape already baked in), so no
  separate CSS bezel is composited on top of it, same reasoning as the hero build.

  Inspiration image (dark teal-gradient, provided by the user) used for CONTENT/STRUCTURE only —
  stacked "GET" / "THE APP" headline, body copy, paired store buttons, phone-on-right layout — not
  its dark gradient styling, consistent with every prior instruction in this project to treat dark
  reference screenshots as content-only inspiration and follow design.md's light theme for the
  actual page chrome.

  Button weight: per this build's explicit instruction ("--color-primary fill for whichever button
  set is styled as primary in this section"), these two store buttons are the primary-styled pair.
  Per SKILL.md rule 5, this section sits directly above the Final CTA banner (§5.13), which also has
  its own solid button — since both could appear in the same viewport while scrolling between them,
  the Final CTA's button has been downgraded to ghost/outline (see final-cta.css) so only one
  primary-weighted pairing appears per screen height.

  --gradient-glow behind the phone visual: this section functions as a CTA-adjacent, hero-like
  device showcase (a download-conversion moment), so it's treated as one of the two places §7
  sanctions the ambient glow (hero + CTA sections) — logged in design.md §9.
-->
