<!--
  Dana AI — Footer (design.md §5.14, site map item 15)

  Real content used verbatim: logo, social URLs, all four link columns + their hrefs, contact
  email, copyright line.

  FLAG: fixed a real, pre-existing bug in assets/dana_logo.svg while building this — it still used
  the original dark-theme mint/violet gradient and near-white (#F5F7FA) wordmark text from before
  the light-theme migration, which computed to 1.07:1 contrast against a white background
  (effectively invisible). Updated to the current --gradient-brand-equivalent chip + black
  wordmark text + Manrope. This also fixes the navbar's logo, which uses the same file. See
  design.md §9.

  Social icons: no linkedin.svg/fb.svg/yt.svg (original or updated) exist anywhere in the project
  (checked assets/ and the whole repo) — hand-drawn as simple solid silhouette marks in one neutral
  color (--color-text-secondary, brightening on hover), consistent with how every other icon in
  this build has been hand-drawn when no icon library/asset was available. This is a different
  treatment from the site's own line-style UI icon family (§7) deliberately — social/brand marks
  are conventionally simple monochrome silhouettes, a distinct category from internal UI icons, not
  a violation of "never mix icon families" (that rule governs the site's own icon language).

  Mission statement is original copy grounded in the real team-page positioning (underserved credit
  access + AI-powered matchmaking in Bangladesh) — not generic boilerplate.

  Newsletter input is new UI (§5.14 asks for it; the live footer has none) — the submit handler
  only prevents the default page-reload; there is no real newsletter/email backend wired up yet
  (see footer.js and design.md §9). This isn't styled as broken/disabled the way "Coming Soon"
  pricing buttons are — it's ordinary new frontend UI built ahead of its backend, not a
  misrepresented product feature.

  No compliance/security badges row: none of those badge assets exist anywhere in the project.
  §5.14 marks this row as "if available" — it isn't, so it's omitted rather than filled with
  fabricated badge icons. Flagged in design.md §9, not painted as an on-page apology (nothing here
  reads as broken by the row's absence, unlike a testimonial or an empty stat would).
-->
